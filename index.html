  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"

    />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="LegisParticipa" />

    <meta property="og:image" content="icon-512.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="theme-color" content="#047857" />
    <meta name="color-scheme" content="light dark" />

    <link rel="icon" type="image/png" sizes="64x64" href="favicon.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <!-- Caminhos relativos: o app é publicado tanto na raiz quanto em subpasta
         (GitHub Pages), e caminhos absolutos quebravam manifest e service worker. -->
    <link rel="manifest" href="manifest.json" />

  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen antialiased selection:bg-emerald-500 selection:text-white">
    <div id="root">
      <!-- Conteúdo inicial: aparece enquanto o bundle carrega e é substituído
           pelo React. Sem isto, a primeira pintura era uma tela em branco. -->
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,'Segoe UI',sans-serif">
        <p style="color:#64748b;font-size:14px">Carregando a agenda de participação cidadã…</p>
      </div>
    </div>
    <noscript>
      <div style="max-width:40rem;margin:4rem auto;padding:1.5rem;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.6">
        <h1 style="font-size:1.25rem">Este aplicativo precisa de JavaScript</h1>
        <p>
          O LegisParticipa consulta as fontes oficiais diretamente no seu navegador, por isso não funciona com o
          JavaScript desativado. Enquanto isso, os dados podem ser consultados na origem:
        </p>
        <ul>
          <li><a href="https://dadosabertos.camara.leg.br/api/v2/eventos">Dados Abertos da Câmara dos Deputados</a></li>
          <li><a href="https://legis.senado.leg.br/dadosabertos/comissao/agenda/atual/iCal">Agenda de comissões do Senado Federal (iCal)</a></li>
        </ul>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
